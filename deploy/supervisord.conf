; Processos do serviço único do Concierge: API (FastAPI), Admin (Payload/Next) e
; o edge (nginx). O runner de jobs NÃO está aqui: desde 2026-09-17 ele roda
; dentro do processo do Admin (`apps/admin/instrumentation.ts`), que já tem o
; Payload carregado — ver a nota abaixo do programa `admin`.
;
; Os três serviços do Render viraram um por fusão: antes eram três serviços pagos
; separados, e a fusão mantém o comportamento eliminando duas instâncias.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/concierge-api-v3
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:admin]
command=/usr/local/bin/npm run start --workspace=@concierge/admin
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; PORT interno do Next (o $PORT do Render é a porta pública do nginx).
; O bind é em LOOPBACK por obrigação, não por preferência: com `--hostname
; 0.0.0.0` o Render detectava o Next como uma porta adicional do serviço
; ("Detected service running on port 10000 with additional ports HTTP:3000") e
; passava a rotear parte das requisições DIRETO para o Next, furando o nginx.
; Resultado: as mesmas rotas respondiam 200 no uvicorn (via nginx) E 404/502 sem
; cabeçalhos CORS (via Next) — o browser reportava "bloqueado por CORS" e 502 de
; forma intermitente. Só o nginx deve ser alcançável de fora.
;
; `--max-old-space-size`: o V8 dimensiona o heap pela RAM do HOST, não pelo
; limite do cgroup — num container de 512Mi com DOIS processos Node ele cresce
; até estourar o limite e o Render mata o container inteiro (medido em
; 2026-09-16: 3 `server_failed` com `oomKilled` em 4 dias, todos durante rajadas
; de tráfego, cada um ~30s de 502 em TODAS as superfícies). O teto é
; deliberadamente menor que a memória disponível: o Python e o nginx precisam do
; resto, e o Next prefere coletar lixo a ser morto. Fica em 200 mesmo com o
; runner de jobs dentro deste processo: a folga que o quarto processo deixou
; ainda não foi medida a 512 MB, e subir teto sem essa prova é trocar um OOM por
; um processo maior que ninguém verificou. A medição é o próximo passo antes de
; qualquer aumento.
environment=NODE_ENV="production",PORT="3000",NODE_OPTIONS="--max-old-space-size=200"

; O runner de jobs NÃO é mais um processo aqui: ele vive dentro do processo do
; Admin (`apps/admin/instrumentation.ts` → `src/jobs/inProcessRunner.ts`), que já
; tem o Payload carregado. Era o processo mais caro que dava para eliminar sem
; perder semântica — ele mantinha uma SEGUNDA cópia de config + mongoose só para
; drenar fila, e foi medido que o container de 512 MB morria por volta de 450 MB
; de pico (5 OOMs em 2 dias, ~30 s de 502 em todas as superfícies a cada um).
; O runner in-process chama `handleSchedules` + `run({ sequential: true })` a
; cada ciclo, com lote de 10 e sem sobreposição — a MESMA semântica do comando
; (`payload jobs:run --handle-schedules`), que também CRIA os agendados; trocar
; por `jobs.autoRun` pararia heartbeat, reconciliação e retenção em silêncio.
; Para voltar atrás: `CMS_JOBS_INPROCESS=false` no processo `admin` e
; reabilitar este programa com `command=/usr/local/bin/npm run start:admin-worker`.

[program:edge]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
