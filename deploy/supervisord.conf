; Processos do serviço único do Concierge.
;
; Os três rodam no MESMO container: a API (FastAPI), o Admin (Payload/Next) e o
; runner de jobs. Antes eram três serviços pagos separados no Render; a fusão
; mantém o comportamento e elimina duas instâncias.
;
; O runner de jobs é um processo próprio (e não jobs.autoRun dentro do Next)
; porque `payload jobs:run --handle-schedules` também CRIA os jobs agendados
; (heartbeat, reconciliação, retenção). O autoRun do Payload só executa filas —
; trocar por ele pararia os agendados, então a divisão atual é preservada.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/concierge-api-v3
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:admin]
command=/usr/local/bin/npm run start --workspace=@concierge/admin
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; PORT interno do Next (o $PORT do Render é a porta pública do nginx).
; O bind é em LOOPBACK por obrigação, não por preferência: com `--hostname
; 0.0.0.0` o Render detectava o Next como uma porta adicional do serviço
; ("Detected service running on port 10000 with additional ports HTTP:3000") e
; passava a rotear parte das requisições DIRETO para o Next, furando o nginx.
; Resultado: as mesmas rotas respondiam 200 no uvicorn (via nginx) E 404/502 sem
; cabeçalhos CORS (via Next) — o browser reportava "bloqueado por CORS" e 502 de
; forma intermitente. Só o nginx deve ser alcançável de fora.
;
; `--max-old-space-size`: o V8 dimensiona o heap pela RAM do HOST, não pelo
; limite do cgroup — num container de 512Mi com DOIS processos Node ele cresce
; até estourar o limite e o Render mata o container inteiro (medido em
; 2026-09-16: 3 `server_failed` com `oomKilled` em 4 dias, todos durante rajadas
; de tráfego, cada um ~30s de 502 em TODAS as superfícies). O teto é
; deliberadamente menor que a memória disponível: o Python e o nginx precisam do
; resto, e o Next prefere coletar lixo a ser morto.
environment=NODE_ENV="production",PORT="3000",NODE_OPTIONS="--max-old-space-size=200"

[program:jobs]
command=/usr/local/bin/npm run start:admin-worker
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Mesmo motivo do `admin`: o runner é o SEGUNDO processo Node do container e o
; V8 não enxerga o limite do cgroup. Teto menor porque ele executa jobs —
; carga de pico curta — e não serve tráfego.
environment=NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=128"

[program:edge]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
