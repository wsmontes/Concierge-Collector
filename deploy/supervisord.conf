; Processos do serviço único do Concierge.
;
; Os três rodam no MESMO container: a API (FastAPI), o Admin (Payload/Next) e o
; runner de jobs. Antes eram três serviços pagos separados no Render; a fusão
; mantém o comportamento e elimina duas instâncias.
;
; O runner de jobs é um processo próprio (e não jobs.autoRun dentro do Next)
; porque `payload jobs:run --handle-schedules` também CRIA os jobs agendados
; (heartbeat, reconciliação, retenção). O autoRun do Payload só executa filas —
; trocar por ele pararia os agendados, então a divisão atual é preservada.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/concierge-api-v3
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:admin]
command=/usr/local/bin/npm run start --workspace=@concierge/admin
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; PORT interno do Next. O $PORT do Render é a porta pública do nginx; o Next
; precisa de uma porta própria e distinta (bind em 0.0.0.0:3000).
environment=NODE_ENV="production",PORT="3000"

[program:jobs]
command=/usr/local/bin/npm run start:admin-worker
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"

[program:edge]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
